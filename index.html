<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>ร้านช็อกโกแลตแท่ง</title>
</head>
<body>
  <h1>🍫 ช็อกโกแลตแท่ง</h1>
  <p>สินค้า SKU-01: ดาร์กช็อกโกแลต (89 บาท)</p>
  <p>สินค้า SKU-02: ช็อกโกแลตนม (95 บาท)</p>
  <form>
    <p>ชื่อผู้รับ: <input type="text" required /></p>
    <p>เบอร์โทร: <input type="tel" required /></p>
    <p>ที่อยู่จัดส่ง: <input type="text" required /></p>
    <p>เลือกสินค้า:
      <select>
        <option>SKU-01 ดาร์กช็อกโกแลต</option>
        <option>SKU-02 ช็อกโกแลตนม</option>
      </select>
    </p>
    <p>จำนวน: <input type="number" value="1" min="1" /></p>
    <button type="submit">สั่งซื้อ</button>
  </form>
</body>
</html>
